<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
    <defs>
      <style>
        
          .axis { stroke: #333; stroke-width: 1.5px; }
          .plane { stroke: #007acc; stroke-width: 2px; }
          .cut { stroke: #c0392b; stroke-width: 2px; stroke-dasharray: 5 3; }
          .label { font-family: sans-serif; font-size: 14px; fill: #333; }
          .math { font-family: serif; font-size: 16px; font-style: italic; fill: #007acc; }
        
      </style>
    </defs>
    
    
    <line x1="40" y1="280" x2="380" y2="280" class="axis" />
    <line x1="40" y1="280" x2="40" y2="40" class="axis" />
    <text x="385" y="285" class="label">x</text>
    <text x="25" y="35" class="label">z</text>

    
    <line x1="20" y1="80" x2="160" y2="220" class="plane" />
    <line x1="160" y1="220" x2="360" y2="120" class="plane" />
    
    
    <circle cx="160" cy="220" r="5" fill="#007acc" />
    <text x="145" y="240" class="math">(x*, z*)</text>

    
    <line x1="60" y1="270" x2="300" y2="70" class="cut" />
    <text x="280" y="60" class="label" fill="#c0392b">Violated Plane</text>
    
    
    <line x1="160" y1="220" x2="160" y2="186" stroke="#333" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="160" cy="186" r="4" fill="#c0392b" />
  </svg>