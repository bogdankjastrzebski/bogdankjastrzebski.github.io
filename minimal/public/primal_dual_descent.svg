<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .poly { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .flat { stroke: #16a34a; stroke-width: 5; fill: none; stroke-linecap: round; }
      .peel { stroke: #f59e0b; stroke-width: 5; fill: none; stroke-linecap: round; }
      .enter { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 7 4; }
      .cube { fill: #dbeafe; fill-opacity: 0.55; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .dir { stroke: #2563eb; stroke-width: 4; }
      .walk { stroke: #52525b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
      .edge { stroke: #d4d4d8; stroke-width: 2; }
      .tree { stroke: #16a34a; stroke-width: 4; }
      .front { stroke: #2563eb; stroke-width: 3; stroke-dasharray: 6 4; }
      .guide { stroke: #a1a1aa; stroke-width: 1; stroke-dasharray: 2 3; }
      .node { fill: #ffffff; stroke: #3f3f46; stroke-width: 2; }
      .settled { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #3f3f46; }
      .cap { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #71717a; }
      .math { font-family: "Linux Libertine", "Times New Roman", Times, serif; font-size: 20px; font-style: italic; fill: #18181b; }
      .mathbig { font-family: "Linux Libertine", "Times New Roman", Times, serif; font-size: 25px; font-style: italic; fill: #18181b; }
    </style>
    <marker id="blu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="gry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#52525b" />
    </marker>
    <marker id="grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ===== left: the dual polytope, active set walk ===== -->
  <polygon points="110,430 88,252 198,120 390,90 500,210 470,390 258,462" class="poly" />

  <!-- facets: held flat (green), peeling off (amber), about to enter (blue dashed) -->
  <line x1="198" y1="120" x2="390" y2="90" class="peel" />
  <line x1="390" y1="90" x2="500" y2="210" class="flat" />
  <line x1="500" y1="210" x2="470" y2="390" class="enter" />

  <!-- the l_infinity cube at the current point, direction search inside it -->
  <rect x="421" y="106" width="68" height="68" class="cube" />

  <!-- the walk: interior start, hit a facet, slide, land at the optimum -->
  <polyline points="250,300 455,150 500,210 470,390" class="walk" marker-mid="url(#gry)" />
  <circle cx="250" cy="300" r="5" fill="#52525b" />
  <text x="196" y="296" class="cap">start</text>

  <!-- current point and its direction -->
  <circle cx="455" cy="150" r="6.5" fill="#1d4ed8" />
  <line x1="455" y1="150" x2="489" y2="196" class="dir" marker-end="url(#blu)" />
  <text x="466" y="142" class="math" fill="#1d4ed8">d&#8902;</text>
  <text x="352" y="86" class="cap" fill="#b45309">peeling off</text>
  <text x="404" y="74" class="cap" fill="#15803d">held flat</text>
  <text x="512" y="300" class="cap" fill="#1d4ed8">next facet</text>
  <text x="504" y="112" class="cap" fill="#2563eb">cube &#8214;d&#8214;<tspan font-size="11px">&#8734;</tspan> &#8804; 1</text>
  <line x1="502" y1="108" x2="489" y2="102" class="guide" />
  <circle cx="470" cy="390" r="7" fill="#18181b" />
  <text x="482" y="412" class="math">y<tspan dy="5" font-size="16px">&#8902;</tspan></text>

  <!-- caption of the sub-problem solved at every iteration -->
  <text x="90" y="512" class="mathbig">max<tspan dy="6" font-size="17px">d</tspan><tspan dy="-6">&#160;b</tspan><tspan dy="-6" font-size="18px">&#7488;</tspan><tspan dy="6">d&#160;</tspan><tspan dy="0">&#160;s.t.&#160; A</tspan><tspan dy="6" font-size="17px">j</tspan><tspan dy="-6">d &#8804; 0&#160;(j &#8712; J),&#160; &#8214;d&#8214;</tspan><tspan dy="-6" font-size="17px">&#8734;</tspan><tspan dy="6"> &#8804; 1</tspan></text>

  <!-- ===== right: the same walk on the shortest-path polytope ===== -->
  <g>
    <!-- non-tree edges -->
    <line x1="660" y1="150" x2="760" y2="110" class="edge" />
    <line x1="760" y1="110" x2="880" y2="180" class="edge" />
    <line x1="660" y1="300" x2="770" y2="360" class="edge" />
    <line x1="880" y1="180" x2="860" y2="330" class="edge" />
    <!-- shortest-path tree -->
    <line x1="650" y1="230" x2="660" y2="150" class="tree" />
    <line x1="650" y1="230" x2="770" y2="240" class="tree" />
    <line x1="770" y1="240" x2="760" y2="110" class="tree" />
    <line x1="770" y1="240" x2="770" y2="360" class="tree" />
    <!-- the frontier arc: the ratio test about to bind -->
    <line x1="860" y1="330" x2="770" y2="360" class="front" marker-start="url(#blu)" />
    <line x1="880" y1="180" x2="860" y2="330" class="edge" />
    <!-- nodes -->
    <circle cx="650" cy="230" r="13" class="settled" />
    <circle cx="660" cy="150" r="13" class="settled" />
    <circle cx="760" cy="110" r="13" class="settled" />
    <circle cx="770" cy="240" r="13" class="settled" />
    <circle cx="770" cy="360" r="13" class="settled" />
    <circle cx="880" cy="180" r="13" class="node" />
    <circle cx="860" cy="330" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" />
    <text x="628" y="262" class="cap" fill="#15803d">settled</text>
    <text x="842" y="150" class="cap">labels = prices</text>
    <text x="810" y="316" class="cap" fill="#1d4ed8">tightens</text>
  </g>

  <text x="576" y="252" class="mathbig">&#8801;</text>

  <text x="606" y="440" class="cap">next vertex settled = next tight constraint</text>
  <text x="606" y="462" class="cap" fill="#18181b" font-weight="600">Dijkstra, read as an active set method</text>
  <text x="92" y="72" class="cap">active set walk on the dual polytope &#183; one LP per pivot</text>
</svg>
